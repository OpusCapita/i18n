version: 2.1

aliases:
  - &docker_auth
    auth:
      username: ${DOCKER_USER}
      password: ${DOCKER_PASS}

  - &default-context
    context:
      - shared-creds

executors:
  default-executor:
    docker:
      - image: opuscapita/minsk-core-ci:4
        <<: *docker_auth
    working_directory: ~/build

  machine-user-executor:
    docker:
      - image: opuscapita/minsk-core-machineuser-env:2
        <<: *docker_auth

orbs:
  jira: circleci/jira@2.0

jobs:
  init:
    executor: machine-user-executor
    steps:
      - run: generate_bash_env_exports.sh GH_MAIL GH_NAME CIRCLE_CI_TOKEN > ~/generated_bash_env
      - persist_to_workspace:
          root: ~/
          paths:
            - generated_bash_env

  build:
    executor: default-executor
    steps:
      - attach_workspace:
          at: /workspace
      - run: cat /workspace/generated_bash_env >> $BASH_ENV
      - checkout

      - restore_cache:
          keys:
            - i18n-{{ .Branch }}-{{ checksum "package.json" }}
            - i18n-{{ .Branch }}
            - i18n

      - run: if [ -f /.dockerenv ]; then configure-maven.sh && configure-grails.sh && configure-npm.sh; fi

      - run:
          name: "Installing dependencies."
          command: yarn install

      - save_cache:
          key: i18n-{{ .Branch }}-{{ checksum "package.json" }}
          paths:
              - /root/build/node_modules
              - /root/build/yarn.lock

      - run:
          name: "Running lint."
          command: npm run lint

      - run:
          name: "Tests."
          command: |
            npm test -- --reporter mocha-junit-reporter
          environment:
            MOCHA_FILE: ./junit/test-results.xml

      - run:
          name: upload-coverage
          command: npm run upload-coverage

      - store_artifacts:
          path: ./junit/test-results.xml
          prefix: tests

      - store_test_results:
          path: ./junit

  build_release:
    executor: default-executor
    steps:
      - attach_workspace:
          at: /workspace
      - run: cat /workspace/generated_bash_env >> $BASH_ENV
      - checkout

      - restore_cache:
          keys:
            - i18n-{{ .Branch }}-{{ checksum "package.json" }}
            - i18n-{{ .Branch }}
            - i18n

      - run: if [ -f /.dockerenv ]; then configure-maven.sh && configure-grails.sh && configure-npm.sh; fi

      - run:
          name: "Installing dependencies."
          command: yarn install

      - save_cache:
          key: i18n-{{ .Branch }}-{{ checksum "package.json" }}
          paths:
              - /root/build/node_modules
              - /root/build/yarn.lock

      - run:
          name: "Running lint."
          command: npm run lint

      - run:
          name: "Deploy."
          command: npm run publish-release

  release:
    executor: default-executor
    steps:
      - attach_workspace:
          at: /workspace
      - run: cat /workspace/generated_bash_env >> $BASH_ENV
      - checkout

      - run: if [ -f /.dockerenv ]; then configure-maven.sh && configure-grails.sh && configure-npm.sh; fi

      - run:
          name: Executing release scrtipt.
          command: .circleci/release.sh

workflows:
  release-and-build:
    jobs:
      - init:
          <<: *default-context
          filters:
            tags:
              only: /.*/
      - release:
          <<: *default-context
          filters:
            branches:
              only: release
          requires:
            - init
          post-steps:
            - jira/notify:
                pipeline_id: << pipeline.id >>
                pipeline_number: << pipeline.number >>

      - build:
          <<: *default-context
          filters:
            branches:
              ignore: release
          requires:
            - init
          post-steps:
            - jira/notify:
                pipeline_id: << pipeline.id >>
                pipeline_number: << pipeline.number >>

      - build_release:
          <<: *default-context
          filters:
            tags:
              only: /.*/
            branches:
              ignore: /.*/
          requires:
            - init
          post-steps:
            - jira/notify:
                pipeline_id: << pipeline.id >>
                pipeline_number: << pipeline.number >>

